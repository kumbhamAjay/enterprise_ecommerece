name: CI

on:
  pull_request:
  push:
    branches: [main, development]

# A newer push to the same branch cancels the older run (no queue of stale builds).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: shopeasy, POSTGRES_PASSWORD: shopeasy, POSTGRES_DB: shopeasy }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shopeasy" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Throwaway values: CI never sees real secrets. Stripe, Resend and Cloudinary are unset, so those code paths use their test doubles.
      DATABASE_URL: postgresql://shopeasy:shopeasy@localhost:5432/shopeasy
      DATABASE_SSL: "false"
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Create the schema (the same file production uses)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/schema.sql
      - run: npm test -- --test-force-exit

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - name: Generate Next.js route types (LayoutProps and PageProps are missing from a fresh checkout)
        run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run build

  docker:
    # Proves both images still build (a broken Dockerfile should fail the pull request, not the deploy).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ./backend, push: false, cache-from: type=gha,scope=backend, cache-to: "type=gha,scope=backend,mode=max" }
      - uses: docker/build-push-action@v6
        with: { context: ./frontend, push: false, cache-from: type=gha,scope=frontend, cache-to: "type=gha,scope=frontend,mode=max" }
